name: python-tests

# Minimal, safe CI: checkout + install + static compile + unit
# tests. It never deploys, never touches a VPS, never writes to
# production buckets or state, never calls a paid model API and
# never pushes or merges.
#
# The repository has no dependency manifest (no pyproject.toml /
# requirements*.txt / setup.py), so the test dependencies are
# installed explicitly. They are the third-party packages the
# suite actually imports: starlette + httpx (the Gateway tests
# load src/web/gateway.py) and PyYAML (used by the config layer).
# Tests use temp dirs / fake env values only; no production secret
# is referenced anywhere in this workflow.

on:
  push:
    branches:
      - feature/gateway-v2
      - main
  pull_request:
    branches:
      - feature/gateway-v2
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: compile + unittest (py3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install starlette httpx pyyaml

      - name: Static compile
        run: python -m compileall -q src

      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v